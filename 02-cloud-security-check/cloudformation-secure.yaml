AWSTemplateFormatVersion: "2010-09-09"
Description: Secure S3 storage with encryption, access logging, and IAM analysis.

Parameters:
  Environment:
    Type: String
    Default: production
    AllowedValues:
      - development
      - staging
      - production
  AccessLogBucketName:
    Type: String
    Description: >-
      Name of an existing centralized S3 log bucket whose policy permits S3
      log delivery from this account. The bucket must be in the same Region.
    MinLength: 3
    MaxLength: 63
    AllowedPattern: '^[a-z0-9][a-z0-9.-]*[a-z0-9]$'
  KeyAdministratorArn:
    Type: String
    Description: ARN of the IAM role allowed to administer the KMS key.
    AllowedPattern: '^arn:[^:]+:iam::[0-9]{12}:role/.+$'
  DataAccessRoleArn:
    Type: String
    Description: ARN of the IAM role allowed to use the KMS key for data access.
    AllowedPattern: '^arn:[^:]+:iam::[0-9]{12}:role/.+$'

Resources:
  DataKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Customer-managed key for the data bucket.
      Enabled: true
      EnableKeyRotation: true
      KeySpec: SYMMETRIC_DEFAULT
      KeyUsage: ENCRYPT_DECRYPT
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowKeyAdministration
            Effect: Allow
            Principal:
              AWS: !Ref KeyAdministratorArn
            Action:
              - kms:CancelKeyDeletion
              - kms:CreateAlias
              - kms:CreateGrant
              - kms:DeleteAlias
              - kms:DescribeKey
              - kms:DisableKey
              - kms:DisableKeyRotation
              - kms:EnableKey
              - kms:EnableKeyRotation
              - kms:GetKeyPolicy
              - kms:GetKeyRotationStatus
              - kms:ListAliases
              - kms:ListGrants
              - kms:ListKeyPolicies
              - kms:ListKeyRotations
              - kms:ListResourceTags
              - kms:PutKeyPolicy
              - kms:RevokeGrant
              - kms:RotateKeyOnDemand
              - kms:ScheduleKeyDeletion
              - kms:TagResource
              - kms:UntagResource
              - kms:UpdateAlias
              - kms:UpdateKeyDescription
            Resource: "*"
          - Sid: AllowDataKeyUse
            Effect: Allow
            Principal:
              AWS: !Ref DataAccessRoleArn
            Action:
              - kms:Decrypt
              - kms:DescribeKey
              - kms:Encrypt
              - kms:GenerateDataKey
              - kms:GenerateDataKeyWithoutPlaintext
              - kms:ReEncryptFrom
              - kms:ReEncryptTo
            Resource: "*"
          - Sid: AllowGrantsForAWSResources
            Effect: Allow
            Principal:
              AWS: !Ref DataAccessRoleArn
            Action:
              - kms:CreateGrant
              - kms:ListGrants
              - kms:RevokeGrant
            Resource: "*"
            Condition:
              Bool:
                kms:GrantIsForAWSResource: "true"
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: DataClassification
          Value: Private

  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              KMSMasterKeyID: !GetAtt DataKey.Arn
              SSEAlgorithm: aws:kms
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      LoggingConfiguration:
        DestinationBucketName: !Ref AccessLogBucketName
        LogFilePrefix: !Sub "access-logs/${AWS::AccountId}/${AWS::Region}/"
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: DataClassification
          Value: Private

  DataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt DataBucket.Arn
              - !Sub "${DataBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  AccountAccessAnalyzer:
    Type: AWS::AccessAnalyzer::Analyzer
    Properties:
      AnalyzerName: !Sub "${AWS::StackName}-account-access-analyzer"
      Type: ACCOUNT
      Tags:
        - Key: Environment
          Value: !Ref Environment

Outputs:
  DataBucketName:
    Description: Name of the encrypted private data bucket.
    Value: !Ref DataBucket
  AccessLogBucket:
    Description: Existing centralized bucket receiving S3 server-access logs.
    Value: !Ref AccessLogBucketName
  DataKeyArn:
    Description: ARN of the customer-managed KMS key used by the data bucket.
    Value: !GetAtt DataKey.Arn
